<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="general.css" />
    <title>Mercelia</title>
  </head>
  <body>
    <header>
      <section class="header-content">
        <div class="header-container">
          <img
            src="img/logo-1-test-new2.jpg"
            alt="Mercelia Logo"
            class="logo"
          />
          <nav>
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="#">About</a></li>
              <li><a href="#">Contacts</a></li>
              <li><a href="#">Why Us</a></li>
              <li><button href="#">Shop now</button></li>
            </ul>
          </nav>
        </div>
        <div class="hero-content">
          <h1 class="heading-primary">Quality shoes that elevate your look</h1>
          <p class="heading-tertiary">
            Affordable, stylish and built to last delivered fast to your
            doorstep
          </p>
          <button class="shop-now-btn">Explore collection</button>
        </div>

        <!-- <div class="hero-section"> -->
        <!-- <img
            src="img/background-img.jpg"
            alt="Hero Image"
            class="background-img"
          /> -->
        <!-- </div> -->
      </section>
    </header>
    <main>
      <section class="Product-grid-section">
        <article class="products-grid grid--3-cols">
          <div class="product-grid grid--2-cols">
            <div>
              <img
                alt="A Nike air shoe image"
                class="product-grid-image"
                src="img/nike.jpg"
              />
            </div>
            <div class="product-data-details">
              <p class="product-name">Apex Runner 2.0</p>
              <p class="product-details">Performance Trail Shoe</p>
              <div class="product-review">
                <span class="product-review-details">4.8 (120 reviews)</span>
                <img
                  class="product-rating"
                  alt="Product-image-review"
                  src="img/ratings/rating-45.png"
                />
              </div>
              <div class="product-price">
                <span class="product-discount">&#8358; 18,000</span>
                <span class="product-original-price">&#8358; 22,500</span>
              </div>

              <div class="size-options">Select size:</div>
              <div class="product-sizes">
                <button class="product-size">40</button>
                <button class="product-size">41</button>
                <button class="product-size">42</button>
                <button class="product-size">43</button>
                <button class="product-size">44</button>
              </div>
              <div class="color-options">Choose color:</div>
              <div class="product-colors">
                <div class="product-color-details">
                  <button class="product-color product-color-1"></button>
                  <span class="color-name">White</span>
                </div>

                <div class="product-color-details">
                  <button class="product-color product-color-2"></button>
                  <span class="color-name">Blue</span>
                </div>

                <div class="product-color-details">
                  <button class="product-color product-color-3"></button>
                  <span class="color-name">Grey</span>
                </div>

                <div class="product-color-details">
                  <button class="product-color product-color-4"></button>
                  <span class="color-name">Black</span>
                </div>
              </div>
              <button class="add-to-cart-btn">Add to Cart</button>
            </div>
          </div>
          <div class="product-grid">ikk98</div>
          <div class="product-grid">egfgvr</div>
        </article>
      </section>
      <!-- <button class="btn-gradient">Hello</button> -->
    </main>
  </body>
</html>
